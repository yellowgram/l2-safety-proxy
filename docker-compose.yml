# The process binds 0.0.0.0 inside the container so Docker can reach it.
# The host publish below is 127.0.0.1 only. Don't change it to "8545:8545":
# that exposes an unauthenticated raw-transaction forwarder.
#
# Put your policy in ./policy.json (start from policy.example.json) and check it:
#   npx l2-send-guard check-policy ./policy.json
services:
  l2-send-guard:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8545:8545"
    environment:
      L2SG_HOST: "0.0.0.0"
      L2SG_PORT: "8545"
      GUARD_MODE: "strict"
      L2SG_CHAINS: "arb-sepolia,op-sepolia,base-sepolia"
      L2SG_DEFAULT_CHAIN: "arb-sepolia"
      L2SG_POLICY_FILE: /config/policy.json
      L2SG_STORE: file:/state/l2-send-guard-state.jsonl
    volumes:
      - ./policy.json:/config/policy.json:ro
      - l2sg-state:/state
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8545/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  l2sg-state:
