title: "[how-to] "
body:
  - type: markdown
    attributes:
      value: |
        Discussions are for how-to. Bugs with an offline repro belong in Issues.
        Key custody, Safe clones and hosted services are out of scope (see SUPPORT.md).
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Say whether you run the proxy or the library, and your GUARD_MODE. Do not paste keys or the allowlist.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you already ran
      description: "check-policy output, npm run demo, or /health — redacted."
    validations:
      required: false
