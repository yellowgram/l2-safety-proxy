title: "[how-to] "
body:
  - type: markdown
    attributes:
      value: |
        Discussions are for how-to. Bugs with an offline repro belong in Issues.
        Custody, new chains, Safe clones, hosted SaaS, grant writing, and Soft-WTP outreach are out of scope (see SUPPORT.md).
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Include your install path (Human/ops or Agent MSP) and GUARD_MODE. Do not paste keys or the allowlist.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you already ran
      description: "policy:check, demo:dual-layer, or /health booleans — redacted."
    validations:
      required: false
