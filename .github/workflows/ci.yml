name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit + integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Example policies are valid
        run: |
          node dist/index.js check-policy policy.example.json
          node dist/index.js check-policy policy.agent.example.json

      - name: Offline demo
        run: node scripts/demo.mjs

  postgres-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Store tests against Postgres
        run: npx vitest run tests/guard
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres

  pack-from-clean-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Pack from a fresh clone, install the tarball, import it
        run: scripts/pack-smoke.sh 'npx --no-install l2-send-guard check-policy "$SRC/policy.agent.example.json"'
