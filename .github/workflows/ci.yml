name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit + integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Example policies are valid
        run: |
          node dist/index.js check-policy policy.example.json
          node dist/index.js check-policy policy.agent.example.json

      - name: Offline demo
        run: node scripts/demo.mjs

  postgres-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Store tests against Postgres
        run: npx vitest run tests/guard
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres
